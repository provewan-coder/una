
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>肌力活動問卷調查</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  background: #f1f5f3;
  font-family: "Microsoft JhengHei", sans-serif;
  color: #333;
}

.container {
  max-width: 550px;
  margin: auto;
  background: white;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

h1 {
  text-align: center;
  color: #268b73;
  font-size: 25px;
}

.subtitle {
  text-align: center;
  color: #888;
  font-size: 14px;
  margin-bottom: 28px;
}

.section {
  margin-top: 25px;
  padding-bottom: 10px;
  border-bottom: 1px solid #eee;
}

.section h3 {
  color: #268b73;
  font-size: 17px;
}

label {
  display: block;
  margin: 17px 0 8px;
  font-weight: bold;
  font-size: 14px;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 15px;
  background: white;
}

textarea {
  resize: vertical;
  min-height: 85px;
}

.radio-group {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.radio-option {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 11px 13px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 14px;
  cursor: pointer;
  font-weight: normal;
  margin: 0;
}

.radio-option input {
  width: auto;
  margin: 0;
  accent-color: #268b73;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 28px;
  border: none;
  border-radius: 10px;
  background: #268b73;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #aaa;
  cursor: not-allowed;
}

#message {
  margin-top: 18px;
  text-align: center;
  line-height: 1.7;
  font-size: 14px;
}

.required {
  color: #e45b5b;
}

</style>
</head>

<body>

<div class="container">

<h1>肌力活動問卷調查</h1>

<div class="subtitle">
感謝您參與本次活動，請依照實際體驗填寫。
</div>

<form id="surveyForm">

<div class="section">
<h3>一、基本資料</h3>

<label>1. 性別 <span class="required">*</span></label>
<div class="radio-group">
<label class="radio-option">
<input type="radio" name="gender" value="男" required> 男
</label>
<label class="radio-option">
<input type="radio" name="gender" value="女"> 女
</label>
<label class="radio-option">
<input type="radio" name="gender" value="其他／不方便透露"> 其他／不方便透露
</label>
</div>

<label>2. 年齡 <span class="required">*</span></label>
<input type="number" name="age" min="1" max="120"
placeholder="請輸入您的年齡" required>

<label>3. 訪談日期 <span class="required">*</span></label>
<input type="date" name="interviewDate" required>

<label>4. 活動地點 <span class="required">*</span></label>
<input type="text" name="location"
placeholder="例如：活動中心、社區據點" required>

</div>

<div class="section">
<h3>二、執行活動</h3>

<label>5. 請選擇今天參與的活動 <span class="required">*</span></label>

<div class="radio-group">

<label class="radio-option">
<input type="radio" name="activity"
value="肌力大富翁" required>
肌力大富翁
</label>

<label class="radio-option">
<input type="radio" name="activity"
value="魔鏡上下肢">
魔鏡上下肢
</label>

</div>
</div>

<div class="section">
<h3>三、活動回饋</h3>

<label>6. 您是否了解今天的活動規則？ <span class="required">*</span></label>
<select name="understand" required>
<option value="">請選擇</option>
<option>非常了解</option>
<option>了解</option>
<option>普通</option>
<option>不太了解</option>
<option>完全不了解</option>
</select>

<label>7. 您覺得今天的活動難易程度如何？ <span class="required">*</span></label>
<select name="difficulty" required>
<option value="">請選擇</option>
<option>非常簡單</option>
<option>簡單</option>
<option>適中</option>
<option>困難</option>
<option>非常困難</option>
</select>

<label>8. 您喜歡今天的活動嗎？ <span class="required">*</span></label>
<select name="like" required>
<option value="">請選擇</option>
<option>非常喜歡</option>
<option>喜歡</option>
<option>普通</option>
<option>不喜歡</option>
<option>非常不喜歡</option>
</select>

<label>9. 您願意再次參加類似活動嗎？ <span class="required">*</span></label>
<select name="joinAgain" required>
<option value="">請選擇</option>
<option>非常願意</option>
<option>願意</option>
<option>不確定</option>
<option>不願意</option>
</select>

<label>10. 您對今天的活動有什麼建議或想法？</label>
<textarea name="suggestion"
placeholder="歡迎留下您的意見（選填）"></textarea>

</div>

<button type="submit" id="submitBtn">
送出問卷
</button>

<div id="message" role="status"></div>

</form>
</div>

<script>

// 請將這裡換成自己的 Google Apps Script 網址
const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzr32iD-Y1LrkMShmF6Llnb14CpmKqK345X3tdXmEFiwHJbONCUVNmo6fZk5ARjTTYb/exec";

const form = document.getElementById("surveyForm");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  if (!form.reportValidity()) {
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "資料傳送中...";
  message.textContent = "";

  const formData = new FormData(form);

  const data = Object.fromEntries(formData.entries());

  try {

    // 使用簡單 POST 避免跨網域預檢請求
    // no-cors 模式無法讀取伺服器回傳內容
    await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=UTF-8"
      },
      body: JSON.stringify(data)
    });

    message.style.color = "#268b73";
    message.textContent =
      "已送出資料！請稍候確認試算表是否收到紀錄。";

    form.reset();

  } catch (error) {

    message.style.color = "#d9534f";
    message.textContent =
      "傳送時發生問題，請檢查網路或稍後再試。";

  } finally {

    submitBtn.disabled = false;
    submitBtn.textContent = "送出問卷";

  }

});

</script>

</body>
</html>
